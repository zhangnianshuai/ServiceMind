# Application Configuration
spring.application.name=servicemind

# Qwen Configuration
spring.ai.model.chat=openai
spring.ai.model.embedding=openai

spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}

# Qwen Chat Model
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=qwen-plus
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.parallel-tool-calls=false

# Qwen Embedding Model
spring.ai.openai.embedding.embeddings-path=/v1/embeddings
spring.ai.openai.embedding.options.model=text-embedding-v4
spring.ai.openai.embedding.options.dimensions=768

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Vector Store Configuration (PGVector)
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false
spring.ai.vectorstore.pgvector.initialize-schema=true

# Agent Prompt Configuration
app.prompt.supervisor-agent=supervisor-agent-v1.md
app.prompt.booking-agent=booking-agent-v1.md
app.prompt.payment-agent=payment-agent-v1.md
app.prompt.escalation-agent=escalation-agent-v1.md

# Logging Configuration
logging.level.com.zhangnianshuai.servicemind=INFO
logging.level.org.springframework.ai=ERROR
logging.level.org.springframework.jdbc.core=WARN

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.ai.chat.client.observations.log-prompt=true
# Business Schema and Database Migration
spring.jpa.properties.hibernate.default_schema=servicemind
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=servicemind
spring.flyway.schemas=servicemind
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# Temporary BYOK Model Sessions
app.model-session.ttl-minutes=30
app.model-session.cleanup-delay-ms=60000