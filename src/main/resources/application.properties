# Application Configuration
spring.application.name=servicemind

# Qwen Configuration
spring.ai.model.chat=openai
spring.ai.model.embedding=openai

spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}

# Qwen Chat Model
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=qwen-plus
spring.ai.openai.chat.options.temperature=0.0
spring.ai.openai.chat.options.parallel-tool-calls=false

# Qwen Embedding Model
spring.ai.openai.embedding.embeddings-path=/v1/embeddings
spring.ai.openai.embedding.options.model=text-embedding-v4
spring.ai.openai.embedding.options.dimensions=768

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Vector Store Configuration (PGVector)
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false
spring.ai.vectorstore.pgvector.initialize-schema=true


# Logging Configuration
logging.level.com.zhangnianshuai.servicemind=INFO
logging.level.org.springframework.ai=ERROR
logging.level.org.springframework.jdbc.core=WARN
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.ai.chat.client.observations.log-prompt=false
# Business Schema and Database Migration
spring.jpa.properties.hibernate.default_schema=servicemind
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=servicemind
spring.flyway.schemas=servicemind
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# Temporary BYOK Model Sessions
app.model-session.ttl-minutes=30
app.model-session.cleanup-delay-ms=60000
# HTTP character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Knowledge File Upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.knowledge.upload.max-file-size-bytes=2097152
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=always

# Authentication and Session
app.security.bootstrap.admin-password=${SERVICEMIND_ADMIN_PASSWORD:}
app.security.bootstrap.agent-password=${SERVICEMIND_AGENT_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SERVICEMIND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.tools.observations.include-content=false
app.public-demo.chat-per-minute=12
app.public-demo.platform-chat-per-day=100
app.public-demo.byok-chat-per-minute=20
app.public-demo.model-session-create-per-hour=5
app.public-demo.rate-limit-cleanup-ms=300000
app.model-session.max-active-per-user=2
